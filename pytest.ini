[pytest]
DJANGO_SETTINGS_MODULE = billing_ai.settings.base
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db -m "not live_api"
django_find_project = true
markers =
    live_api: llama a la API real de Anthropic (cuesta dinero; requiere ANTHROPIC_API_KEY). Ejecutar con: pytest -m live_api
