# Easypanel (servicio "Docker Compose"): web + Redis + worker de Celery.
# PostgreSQL NO va aquí: se usa el servicio Postgres de Easypanel (POSTGRES_HOST).
#
# Variables: se definen en la pestaña de entorno del servicio; Compose las toma de ahí con ${VAR}.
# Plantilla: .env.easypanel.example
#
# Red: los servicios de Easypanel (el Postgres) viven en una red de Docker aparte. web y worker se unen
# a ella además de a la red del compose; Redis se queda solo en la del compose. El nombre de la red va
# en EASYPANEL_NETWORK (por defecto «easypanel»); se comprueba en el servidor con `docker network ls`.
#
# Dominio: en Easypanel, apuntar el dominio al servicio "web", puerto 8000 (él pone el HTTPS).
# No se publican puertos en el host a propósito.
#
# Antes del primer arranque: crear en el Postgres de Easypanel la base de datos y el usuario.
# La web ejecuta `migrate` al arrancar (entrypoint.sh) y crea las tablas.

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: billing_ai.settings.production
  SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-facturia.xyz,www.facturia.xyz}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Base de datos (servicio Postgres de Easypanel)
  POSTGRES_HOST: ${POSTGRES_HOST:?define POSTGRES_HOST (nombre interno del servicio Postgres)}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}

  # Cola
  CELERY_BROKER_URL: redis://facturia-redis:6379/0   # nombre propio: «redis» podría chocar con otro servicio de la red de Easypanel

  # Documentos en Cloudflare R2 (obligatorio en producción)
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?define R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?define R2_SECRET_ACCESS_KEY}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:?define R2_BUCKET_NAME}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?define R2_ENDPOINT_URL}

  # Extracción con Claude
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?define ANTHROPIC_API_KEY}
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-haiku-5-5}
  EXTRACTION_FALLBACK_MODEL: ${EXTRACTION_FALLBACK_MODEL:-claude-sonnet-5-5}
  EXTRACTION_AUTO_APPROVE: ${EXTRACTION_AUTO_APPROVE:-False}
  EXTRACTION_EFFORT: ${EXTRACTION_EFFORT:-low}
  EXTRACTION_MAX_TOKENS: ${EXTRACTION_MAX_TOKENS:-8192}   # subir (p. ej. 16000) si hay facturas muy largas
  UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-20}

  # Seguridad / red
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
  STORAGE_SSE: ${STORAGE_SSE:-}   # vacío en R2

  # Gunicorn (solo lo usa la web)
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}

services:
  facturia-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: billing_ai:latest
    restart: unless-stopped
    environment: *django-env
    networks: [default, easypanel]
    depends_on:
      facturia-redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: .
    image: billing_ai:latest
    restart: unless-stopped
    # El CMD de la imagen arranca gunicorn; aquí se sustituye por el worker.
    command: celery -A billing_ai worker -l info --concurrency 2
    environment: *django-env
    networks: [default, easypanel]
    depends_on:
      facturia-redis:
        condition: service_healthy
      web:
        condition: service_started   # la web ejecuta las migraciones al arrancar

networks:
  easypanel:
    external: true
    name: ${EASYPANEL_NETWORK:-easypanel}

volumes:
  redis_data:
