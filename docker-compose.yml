# Desarrollo local: Django runserver (con autoreload) + PostgreSQL
#
# Uso:
#   docker compose up --build          # http://localhost:8000
#   docker compose exec web python manage.py createsuperuser
#   docker compose exec web pytest
#
# Producción: ver docker-compose.prod.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_ai
      POSTGRES_USER: billing_ai
      POSTGRES_PASSWORD: billing_ai
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      # Para conectar con DBeaver/pgAdmin desde el host (5433 para no chocar con un Postgres local)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_ai -d billing_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: billing_ai:dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: billing_ai.settings.docker_dev
      POSTGRES_HOST: db
    volumes:
      # Código montado: los cambios se recargan sin reconstruir la imagen
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_dev_data:
